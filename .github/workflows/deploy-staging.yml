name: Deploy to Staging (Cloudflare Pages)

on:
  pull_request:
    types: [labeled, synchronize]

env:
  PROJECT_NAME: gh200-tictactoe-app

jobs:
  build-and-stage:
    # 核心條件式：僅當 PR 帶有 'stage' 標籤時才觸發（GH-200 關鍵考點）
    if: contains(github.event.pull_request.labels.*.name, 'stage')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies & Build Webpack
        run: |
          npm ci
          npm run build
          mkdir -p dist
          cp index.html dist/
          cp -r public dist/

      # 修正：使用 Cloudflare 官方 wrangler-action
      - name: Deploy Staging Preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=${{ github.head_ref }}