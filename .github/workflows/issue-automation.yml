name: Learning GitHub Script

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼 (讀取範本所需)
        uses: actions/checkout@v4

      - name: 讀取 Markdown 範本並自動回覆
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/ISSUE_RESPONSES/comment.md';

            if (fs.existsSync(path)) {
              const issueBody = fs.readFileSync(path, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: issueBody
              });
            } else {
              core.setFailed(`找不到範本檔案：${path}`);
            }
